<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Payment Gateway</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050B14',
                        cardBg: '#0B1A30',
                        accentBlue: '#1E63F0',
                        deepBlue: '#0B2A6F',
                        neonCyan: '#00F0FF',
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-poppins min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Header -->
    <header class="bg-cardBg/90 backdrop-blur-md border-b border-accentBlue/20 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-darkBg border border-accentBlue/40 rounded-xl flex items-center justify-center font-orbitron font-bold text-accentBlue text-sm">
                    UID
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide text-gray-100">UID TOPUP</h1>
                    <p id="displayTrx" class="text-[11px] text-gray-400 font-mono truncate max-w-[160px]">Trx ID: sKoF51ZDCeZnwinDyR7J...</p>
                </div>
            </div>
            <div class="text-right flex items-center space-x-2">
                <div>
                    <span id="displayAmount" class="font-orbitron font-bold text-lg text-neonCyan">40 BDT</span>
                    <button class="text-gray-400 hover:text-white text-xs block">▼</button>
                </div>
                <!-- Admin Panel Trigger Button -->
                <button onclick="toggleAdminPanel()" class="bg-accentBlue/20 hover:bg-accentBlue border border-accentBlue text-neonCyan hover:text-white p-1.5 rounded-lg text-xs transition" title="অ্যাডমিন প্যানেল">
                    ⚙️
                </button>
            </div>
        </div>
        <!-- Countdown Timer Bar -->
        <div class="bg-accentBlue/10 border-t border-accentBlue/20 py-1.5 px-4 text-center text-xs text-gray-300 font-medium">
            ⏱ <span id="timer" class="font-bold text-neonCyan">14m 54s</span> পর মেয়াদ শেষ হবে
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto px-4 py-5 flex-grow">
        
        <!-- Tabs (সব পদ্ধতি / মোবাইল ব্যাংকিং) -->
        <div class="flex space-x-2 mb-5">
            <button onclick="switchTab('all')" id="tabAll" class="flex-1 py-2.5 px-4 rounded-xl border border-accentBlue bg-accentBlue/20 text-neonCyan font-semibold text-sm transition flex items-center justify-center space-x-2">
                <span>☷</span> <span>সব পদ্ধতি</span>
            </button>
            <button onclick="switchTab('mobile')" id="tabMobile" class="flex-1 py-2.5 px-4 rounded-xl border border-accentBlue/30 bg-cardBg text-gray-300 font-semibold text-sm transition flex items-center justify-center space-x-2">
                <span>📱</span> <span>মোবাইল ব্যাংকিং</span>
            </button>
        </div>

        <!-- Payment Methods Grid -->
        <div class="grid grid-cols-2 gap-3 mb-6" id="paymentMethodsGrid">
            <div onclick="selectMethod(this, 'bKash Merchant')" class="pay-card cursor-pointer border border-neonCyan bg-accentBlue/10 p-4 rounded-2xl flex flex-col items-center text-center transition group relative">
                <div class="h-10 flex items-center justify-center mb-2">
                    <span class="font-bold text-pink-500 text-xl tracking-tighter">bKash</span>
                </div>
                <span class="text-xs font-semibold text-gray-300 group-hover:text-white">bKash Merchant</span>
            </div>

            <div onclick="selectMethod(this, 'bKash Payment')" class="pay-card cursor-pointer border border-accentBlue/30 bg-cardBg hover:border-neonCyan p-4 rounded-2xl flex flex-col items-center text-center transition group relative">
                <div class="h-10 flex items-center justify-center mb-2">
                    <span class="font-bold text-pink-500 text-xl tracking-tighter">bKash</span>
                </div>
                <span class="text-xs font-semibold text-gray-300 group-hover:text-white">bKash Payment</span>
            </div>

            <div onclick="selectMethod(this, 'Nagad Personal')" class="pay-card cursor-pointer border border-accentBlue/30 bg-cardBg hover:border-neonCyan p-4 rounded-2xl flex flex-col items-center text-center transition group relative">
                <div class="h-10 flex items-center justify-center mb-2">
                    <span class="font-bold text-orange-500 text-lg">নগদ</span>
                </div>
                <span class="text-xs font-semibold text-gray-300 group-hover:text-white">Nagad Personal</span>
            </div>

            <div onclick="selectMethod(this, 'Rocket Personal')" class="pay-card cursor-pointer border border-accentBlue/30 bg-cardBg hover:border-neonCyan p-4 rounded-2xl flex flex-col items-center text-center transition group relative">
                <div class="h-10 flex items-center justify-center mb-2">
                    <span class="font-bold text-purple-400 text-lg">রকেট</span>
                </div>
                <span class="text-xs font-semibold text-gray-300 group-hover:text-white">Rocket Personal</span>
            </div>

            <div onclick="selectMethod(this, 'Upay Personal')" class="pay-card cursor-pointer border border-accentBlue/30 bg-cardBg hover:border-neonCyan p-4 rounded-2xl flex flex-col items-center text-center transition group relative">
                <div class="h-10 flex items-center justify-center mb-2">
                    <span class="font-bold text-orange-400 text-lg">উপায়</span>
                </div>
                <span class="text-xs font-semibold text-gray-300 group-hover:text-white">Upay Personal</span>
            </div>

            <div onclick="selectMethod(this, 'Bangla QR')" class="pay-card cursor-pointer border border-accentBlue/30 bg-cardBg hover:border-neonCyan p-4 rounded-2xl flex flex-col items-center text-center transition group relative">
                <div class="h-10 flex items-center justify-center mb-2">
                    <span class="font-bold text-green-400 text-sm border border-green-400/50 px-2 py-1 rounded">BANGLA QR</span>
                </div>
                <span class="text-xs font-semibold text-gray-300 group-hover:text-white">Bangla QR</span>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="proceedPayment()" class="w-full py-4 bg-gradient-to-r from-accentBlue to-deepBlue hover:from-deepBlue hover:to-neonCyan text-white font-orbitron font-bold rounded-2xl shadow-lg shadow-accentBlue/30 transition transform active:scale-95 text-center text-base tracking-wide mb-4">
            <span id="btnAmountText">40 BDT</span> পেমেন্ট করুন
        </button>

        <div class="text-center">
            <a href="index.html" class="text-xs text-gray-400 hover:text-red-400 underline transition">
                বাতিল করে মার্চেন্টে ফিরে যান
            </a>
        </div>
    </main>

    <!-- ADMIN PANEL MODAL (লুকানো থাকবে, গিয়ার আইকন ক্লিক করলে আসবে) -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-accentBlue rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-accentBlue/30 pb-3">
                <h3 class="font-orbitron font-bold text-neonCyan text-sm">🛠️ অ্যাডমিন কন্ট্রোল প্যানেল</h3>
                <button onclick="toggleAdminPanel()" class="text-gray-400 hover:text-white font-bold">✕</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">টাকার পরিমাণ (Amount e.g. 100 BDT):</label>
                    <input type="text" id="inputAmount" class="w-full bg-darkBg border border-accentBlue/40 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-neonCyan">
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">ট্রানজেকশন আইডি (Trx ID):</label>
                    <input type="text" id="inputTrx" class="w-full bg-darkBg border border-accentBlue/40 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-neonCyan">
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">টাইমার টেক্সট (যেমন: 14m 54s):</label>
                    <input type="text" id="inputTimer" class="w-full bg-darkBg border border-accentBlue/40 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-neonCyan">
                </div>

                <button onclick="saveAdminData()" class="w-full py-3 bg-gradient-to-r from-accentBlue to-deepBlue hover:from-deepBlue hover:to-neonCyan text-white font-orbitron font-bold rounded-xl text-xs transition shadow-md">
                    সেভ ও আপডেট করুন
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-md w-full mx-auto px-4 py-4 flex items-center justify-between text-xs text-gray-400 border-t border-accentBlue/10">
        <div class="flex items-center space-x-1 cursor-pointer hover:text-white">
            <span>🎧</span> <span>সাপোর্ট</span>
        </div>
        <div class="flex items-center space-x-1 cursor-pointer hover:text-white">
            <span>🌐</span> <span>বাংলা</span>
        </div>
    </footer>

    <!-- Script to handle Dynamic Admin Data -->
    <script>
        let selectedMethodName = 'bKash Merchant';

        // Load saved data on page load
        window.onload = function() {
            if(localStorage.getItem('admin_amount')) {
                let amt = localStorage.getItem('admin_amount');
                document.getElementById('displayAmount').innerText = amt;
                document.getElementById('btnAmountText').innerText = amt;
            }
            if(localStorage.getItem('admin_trx')) {
                document.getElementById('displayTrx').innerText = "Trx ID: " + localStorage.getItem('admin_trx');
            }
            if(localStorage.getItem('admin_timer')) {
                document.getElementById('timer').innerText = localStorage.getItem('admin_timer');
            }
        }

        function toggleAdminPanel() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
            // Fill current values into inputs
            document.getElementById('inputAmount').value = document.getElementById('displayAmount').innerText;
            document.getElementById('inputTrx').value = localStorage.getItem('admin_trx') || 'sKoF51ZDCeZnwinDyR7J...';
            document.getElementById('inputTimer').value = document.getElementById('timer').innerText;
        }

        function saveAdminData() {
            let newAmt = document.getElementById('inputAmount').value;
            let newTrx = document.getElementById('inputTrx').value;
            let newTimer = document.getElementById('inputTimer').value;

            // Save to LocalStorage
            localStorage.setItem('admin_amount', newAmt);
            localStorage.setItem('admin_trx', newTrx);
            localStorage.setItem('admin_timer', newTimer);

            // Update UI instantly
            document.getElementById('displayAmount').innerText = newAmt;
            document.getElementById('btnAmountText').innerText = newAmt;
            document.getElementById('displayTrx').innerText = "Trx ID: " + newTrx;
            document.getElementById('timer').innerText = newTimer;

            toggleAdminPanel();
            alert('সফলভাবে আপডেট করা হয়েছে!');
        }

        function selectMethod(element, name) {
            selectedMethodName = name;
            document.querySelectorAll('.pay-card').forEach(card => {
                card.classList.remove('border-neonCyan', 'bg-accentBlue/10');
                card.classList.add('border-accentBlue/30', 'bg-cardBg');
            });
            element.classList.remove('border-accentBlue/30', 'bg-cardBg');
            element.classList.add('border-neonCyan', 'bg-accentBlue/10');
        }

        function switchTab(tab) {
            const tabAll = document.getElementById('tabAll');
            const tabMobile = document.getElementById('tabMobile');
            if(tab === 'all') {
                tabAll.className = "flex-1 py-2.5 px-4 rounded-xl border border-accentBlue bg-accentBlue/20 text-neonCyan font-semibold text-sm transition flex items-center justify-center space-x-2";
                tabMobile.className = "flex-1 py-2.5 px-4 rounded-xl border border-accentBlue/30 bg-cardBg text-gray-300 font-semibold text-sm transition flex items-center justify-center space-x-2";
            } else {
                tabMobile.className = "flex-1 py-2.5 px-4 rounded-xl border border-accentBlue bg-accentBlue/20 text-neonCyan font-semibold text-sm transition flex items-center justify-center space-x-2";
                tabAll.className = "flex-1 py-2.5 px-4 rounded-xl border border-accentBlue/30 bg-cardBg text-gray-300 font-semibold text-sm transition flex items-center justify-center space-x-2";
            }
        }

        function proceedPayment() {
            let currentAmt = document.getElementById('displayAmount').innerText;
            alert(`${selectedMethodName} মাধ্যমে ${currentAmt} পেমেন্ট প্রসেস শুরু হচ্ছে...`);
        }
    </script>
</body>
</html>
